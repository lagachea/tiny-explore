<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Camera Capture Demo</title>
	<style>
		:root {
			color-scheme: light dark;
		}

		body {
			font-family: system-ui, sans-serif;
			margin: 0;
			padding: 24px;
			display: grid;
			gap: 16px;
		}

		.wrap {
			display: grid;
			gap: 12px;
			max-width: 720px;
		}

		video,
		img,
		canvas {
			width: 100%;
			border-radius: 12px;
			background: #0002;
		}

		.row {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			align-items: center;
		}

		button {
			padding: 10px 14px;
			border-radius: 10px;
			border: 1px solid #8884;
			cursor: pointer;
		}

		.hint {
			font-size: 0.9rem;
			opacity: 0.8;
		}

		#fallback {
			display: none;
		}
	</style>
</head>

<body>
	<div class="wrap">
		<h1>Take a Photo</h1>

		<!-- Live camera preview -->
		<video id="preview" autoplay playsinline></video>

		<div class="row">
			<button id="capture">📸 Capture</button>
			<button id="switch">🔄 Switch Camera</button>
			<span class="hint">Grant camera permission. Works best over HTTPS.</span>
		</div>

		<!-- The captured photo will appear here -->
		<img id="photo" alt="Your photo will appear here" />

		<!-- Fallback for browsers that block getUserMedia (older iOS Safari, etc.) -->
		<div id="fallback">
			<p class="hint">If the camera preview above doesn't work, use this fallback:</p>
			<input id="filepick" type="file" accept="image/*" capture="environment" />
		</div>

		<!-- Hidden canvas used to grab a frame from the video -->
		<canvas id="canvas" hidden></canvas>
	</div>

	<script>
		const video = document.getElementById('preview');
		const captureBtn = document.getElementById('capture');
		const switchBtn = document.getElementById('switch');
		const photo = document.getElementById('photo');
		const canvas = document.getElementById('canvas');
		const fallback = document.getElementById('fallback');
		const filepick = document.getElementById('filepick');

		let currentStream; // MediaStream
		let usingBackCamera = true;

		async function startCamera() {
			stopCamera();
			const constraints = {
				audio: false,
				video: {
					facingMode: usingBackCamera ? {ideal: 'environment'} : {ideal: 'user'},
					width: {ideal: 1280},
					height: {ideal: 720}
				}
			};
			try {
				const stream = await navigator.mediaDevices.getUserMedia(constraints);
				currentStream = stream;
				video.srcObject = stream;
				fallback.style.display = 'none';
			} catch (err) {
				console.warn('getUserMedia failed, enabling fallback', err);
				fallback.style.display = 'block';
			}
		}

		function stopCamera() {
			if (currentStream) {
				currentStream.getTracks().forEach(t => t.stop());
				currentStream = null;
			}
		}

		captureBtn.addEventListener('click', () => {
			if (video.srcObject) {
				const w = video.videoWidth || 1280;
				const h = video.videoHeight || 720;
				canvas.width = w;
				canvas.height = h;
				const ctx = canvas.getContext('2d');
				ctx.drawImage(video, 0, 0, w, h);
				canvas.toBlob(blob => {
					if (!blob) return;
					const url = URL.createObjectURL(blob);
					photo.src = url;
				}, 'image/jpeg', 0.92);
			}
		});

		switchBtn.addEventListener('click', async () => {
			usingBackCamera = !usingBackCamera;
			await startCamera();
		});

		// Fallback: use chosen file
		if (filepick) {
			filepick.addEventListener('change', () => {
				const file = filepick.files && filepick.files[0];
				if (!file) return;
				const url = URL.createObjectURL(file);
				photo.src = url;
			});
		}

		// Start on load
		if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
			startCamera();
		} else {
			fallback.style.display = 'block';
		}

		// Clean up when leaving the page
		window.addEventListener('beforeunload', stopCamera);
		document.addEventListener('visibilitychange', () => {
			if (document.hidden) stopCamera();
		});
	</script>
</body>

</html>
