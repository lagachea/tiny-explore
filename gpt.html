<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Camera Capture Demo</title>
	<script type="module">
		import smallmodel from "./models/SmallModel.js"
		window.smalltiny = smallmodel;
		//       import alexnet from "./models/AlexNet.js"
		//       window.smalltiny = alexnet;
		// alex = await alexnet.load(device, "./models/AlexNet.safetensors");
	</script>
	<style>
		:root {
			color-scheme: light dark;
		}

		body {
			font-family: system-ui, sans-serif;
			margin: 0;
			padding: 24px;
			display: grid;
			gap: 16px;
		}

		.wrap {
			display: grid;
			gap: 12px;
			max-width: 720px;
		}

		video,
		img,
		canvas {
			width: 100%;
			border-radius: 12px;
			background: #0002;
		}

		.row {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			align-items: center;
		}

		button {
			padding: 10px 14px;
			border-radius: 10px;
			border: 1px solid #8884;
			cursor: pointer;
		}

		.hint {
			font-size: 0.9rem;
			opacity: 0.8;
		}

		#fallback {
			display: none;
		}
	</style>
</head>

<body>
	<div class="wrap">
		<div id="result">result will go here</div>
		<h1>Take a Photo</h1>

		<!-- Live camera preview -->
		<video id="preview" autoplay playsinline></video>

		<div class="row">
			<button id="capture">📸 Capture</button>
			<button id="switch">🔄 Switch Camera</button>
			<span class="hint">Grant camera permission. Works best over HTTPS.</span>
		</div>

		<!-- The captured photo will appear here -->
		<img id="photo" alt="Your photo will appear here" />

		<!-- Fallback for browsers that block getUserMedia (older iOS Safari, etc.) -->
		<div id="fallback">
			<p class="hint">If the camera preview above doesn't work, use this fallback:</p>
			<input id="filepick" type="file" accept="image/*" />
		</div>
		<div id="detected">detection will go here</div>

		<!-- Hidden canvas used to grab a frame from the video -->
		<canvas id="canvas" hidden></canvas>
	</div>

	<script>
		const video = document.getElementById('preview');
		const captureBtn = document.getElementById('capture');
		const switchBtn = document.getElementById('switch');
		const photo = document.getElementById('photo');
		const canvas = document.getElementById('canvas');
		const fallback = document.getElementById('fallback');
		const filepick = document.getElementById('filepick');
		const resultText = document.getElementById('result');
		const detected = document.getElementById('detected');
		let labels, net;


		let currentStream; // MediaStream
		let usingBackCamera = true;

		async function startCamera() {
			stopCamera();
			const constraints = {
				audio: false,
				video: {
					facingMode: usingBackCamera ? {ideal: 'environment'} : {ideal: 'user'},
					width: {ideal: 1280},
					height: {ideal: 720}
				}
			};
			try {
				const stream = await navigator.mediaDevices.getUserMedia(constraints);
				currentStream = stream;
				video.srcObject = stream;
				fallback.style.display = 'block';
			} catch (err) {
				error("fallback without camera")
				console.warn('getUserMedia failed, enabling fallback', err);
				fallback.style.display = 'block';
			}
		}

		function stopCamera() {
			if (currentStream) {
				currentStream.getTracks().forEach(t => t.stop());
				currentStream = null;
			}
		}

		captureBtn.addEventListener('click', () => {
			if (video.srcObject) {
				const w = video.videoWidth || 1280;
				const h = video.videoHeight || 720;
				canvas.width = w;
				canvas.height = h;

				const ctx = canvas.getContext("2d", {willReadFrequently: true});
				ctx.drawImage(video, 0, 0, w, h);

				canvas.toBlob(blob => {
					if (!blob) return;
					const url = URL.createObjectURL(blob);
					photo.src = url;
				}, 'image/jpeg', 1);
			}
		});

		switchBtn.addEventListener('click', async () => {
			usingBackCamera = !usingBackCamera;
			await startCamera();
		});

		// Fallback: use chosen file
		if (filepick) {
			filepick.addEventListener('change', () => {
				const file = filepick.files && filepick.files[0];
				if (!file) return;
				const url = URL.createObjectURL(file);
				photo.src = url;
			});
		}

		// Start on load
		if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
			startCamera();
		} else {
			fallback.style.display = 'block';
		}

		// Clean up when leaving the page
		window.addEventListener('beforeunload', stopCamera);
		document.addEventListener('visibilitychange', () => {
			if (document.hidden) stopCamera();
		});

		const error = (err) => {
			resultText.innerHTML = `Error: ${err}`;
			throw new Error(err);
		}

		const getDevice = async () => {
			if (!navigator.gpu) error("WebGPU not supported.");
			const adapter = await navigator.gpu.requestAdapter();
			return await adapter.requestDevice({
				powerPreference: "high-performance"
			});
		};

		const getLabels = async () => (await fetch("./models/SmallModel.json")).json();

		const reorderChannelsAndRemoveAlpha = (data) => {
			const out = [];
			let i = 0;
			for (let c = 0; c < 3; c++) {
				for (let x = 0; x < 224 * 224; x++) {
					out[i] = data[x * 4 + c];
					i++;
				}
			}
			return out;
		};

		function prepareInput() {
			const ctx = canvas.getContext("2d", {willReadFrequently: true});
			const pixels = ctx.getImageData(0, 0, 224, 224).data;
			const red = [], green = [], blue = [];

			for (let index = 0; index < pixels.length; index += 4) {
				red.push(pixels[index]);
				green.push(pixels[index + 1]);
				blue.push(pixels[index + 2]);
			}
			return [...red, ...green, ...blue];
		}

		const how_to_get_image = async (resource) => {
			const img = new Image();
			img.onload = () => {
				ctx.drawImage(img, 0, 0, 224, 224);
				const data = ctx.getImageData(0, 0, 224, 224).data;
				runNet(data)
			};
			img.src = resource;
		}

		const loadLet = async () => {
			try {
				resultText.innerHTML = "loading..."
				labels = await getLabels();
				const device = await getDevice();
				net = await smalltiny.load(device, "./models/SmallModel.safetensors");
				resultText.innerHTML = "ready"
			} catch (e) {
				error(e)
			}
		}

		function softmax(arr) {
			const maxVal = Math.max(...arr);       // prevent overflow
			const exps = arr.map(v => Math.exp(v - maxVal));
			const sum = exps.reduce((a, b) => a + b, 0);

			// Handle edge case: sum ~ 0
			if (sum === 0 || !isFinite(sum)) {
				window.alert("uniform")
				// fallback: uniform distribution
				return Array(arr.length).fill(1 / arr.length);
			}

			return exps.map(e => e / sum);
		}


		const runNet = async () => {
			if (!net) error("Net not loaded yet.");

			const input = prepareInput()
			const out = await net(new Float32Array(input))
			// need softmax from number to percent
			outmax = softmax(out[0])
			window.alert(outmax)
			// then index of max for labels index
			const index = outmax.indexOf(Math.max(...outmax));
			window.alert(labels[index])
			detected.innerHTML = labels[index];
		};

		photo.addEventListener("load", () => {
			runNet()
		});

		loadLet();

	</script>
</body>

</html>
